<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#25132f"><title>Faithfulord Affiliate Studio</title>
<style>
:root{--ink:#25132f;--plum:#4b2460;--gold:#d9b56d;--cream:#faf8f4;--paper:#fff;--muted:#77717b;--line:#e9e3e9;--green:#236b4d;--red:#a64343;--soft:#f2edf5;--shadow:0 8px 30px #2f18300d}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--plum)}.shell{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.side{background:var(--ink);color:#fff;padding:25px 16px;display:flex;flex-direction:column;gap:22px}.brand{padding:0 10px}.brand strong{display:block;font-size:17px;letter-spacing:.01em}.brand small{color:#d9c9df}.mark{display:inline-grid;place-items:center;background:var(--gold);color:var(--ink);border-radius:10px;width:34px;height:34px;font-weight:900;margin-right:9px}.nav{display:grid;gap:5px}.nav button{border:0;background:none;color:#e6dfe9;text-align:left;padding:11px 12px;border-radius:10px}.nav button:hover,.nav button.active{background:#ffffff18;color:white}.nav button span{display:inline-block;width:28px}.side-note{margin-top:auto;border:1px solid #ffffff25;border-radius:14px;padding:13px;font-size:12px;color:#e2d9e7}.side-note b{color:var(--gold)}main{min-width:0}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,48px);background:#ffffffc7;position:sticky;top:0;z-index:3;backdrop-filter:blur(10px)}.top h1{font-size:15px;margin:0}.top .user{font-size:13px;color:var(--muted)}.content{max-width:1220px;padding:30px clamp(18px,4vw,48px) 60px;margin:auto}.intro{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:23px}.intro h2{font-size:26px;line-height:1.2;margin:0 0 7px}.intro p{margin:0;color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-weight:750;color:var(--plum);font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:9px;color:var(--ink);font-weight:650}.btn:hover{border-color:var(--plum)}.btn.primary{background:var(--plum);border-color:var(--plum);color:#fff}.btn.gold{background:var(--gold);border-color:var(--gold)}.btn.danger{color:var(--red)}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:20px 0}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow)}.stat label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:25px;margin-top:4px}.stat small{color:var(--muted)}.two{grid-template-columns:1.2fr .8fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.section-title h3{font-size:16px;margin:0}.muted{color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 9px;background:var(--soft);color:var(--plum);font-size:11px;font-weight:700}.pill.good{background:#eaf4ef;color:var(--green)}.pill.warn{background:#fff3dd;color:#8c5d0a}.pill.bad{background:#f9eaea;color:var(--red)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.row strong{display:block}.row small{color:var(--muted)}.progress{height:8px;background:#eee8f0;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--plum),var(--gold));border-radius:9px}.empty{padding:25px 14px;text-align:center;color:var(--muted);border:1px dashed #d7ced9;border-radius:12px}.hidden{display:none!important}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#544a59}.field input,.field select,.field textarea{width:100%;border:1px solid #ddd4df;border-radius:9px;padding:10px 11px;background:white;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--plum);box-shadow:0 0 0 3px #4b246014}.field textarea{min-height:86px;resize:vertical}.form-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}.item-list{display:grid;gap:9px}.product,.post,.dep{border:1px solid var(--line);border-radius:12px;padding:13px;background:white}.product-head{display:flex;justify-content:space-between;gap:10px}.product h4,.post h4{margin:0 0 3px;font-size:14px}.product p,.post p{margin:3px 0;color:var(--muted);font-size:13px}.score{color:var(--plum);font-weight:800}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.tab{padding:8px 11px;background:white;border:1px solid var(--line);border-radius:9px;color:var(--muted)}.tab.active{background:var(--plum);color:white;border-color:var(--plum)}.notice{border-radius:12px;padding:12px 14px;background:#f8f0dd;color:#63490f;font-size:13px}.notice.green{background:#eaf4ef;color:#20573f}.notice.red{background:#f9eaea;color:#812f2f}.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.check input{margin-top:4px;accent-color:var(--plum)}.check label{font-size:13px}.check small{display:block;color:var(--muted)}.dependency{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.dependency select{border:1px solid var(--line);border-radius:8px;padding:7px}.calendar-list{display:grid;gap:10px}.calendar-date{min-width:75px;text-align:center;padding:8px;border-radius:10px;background:var(--soft);font-size:12px;color:var(--plum);font-weight:700}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.metrics .field{min-width:0}.footer{color:var(--muted);font-size:11px;padding-top:22px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:11px 16px;border-radius:10px;z-index:10;box-shadow:var(--shadow)}.menu-toggle{display:none}.modal-back{position:fixed;inset:0;background:#160b1c88;z-index:5;display:grid;place-items:center;padding:18px}.modal{background:#fff;border-radius:16px;padding:22px;width:min(720px,100%);max-height:90vh;overflow:auto}.modal h3{margin-top:0}.small{font-size:12px}.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.score-grid .field label{font-size:11px}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:fixed;z-index:6;inset:0 auto 0 0;width:270px;transform:translateX(-100%);transition:.2s}.side.open{transform:translateX(0)}.menu-toggle{display:inline-flex}.stats{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.content{padding-top:22px}}@media(max-width:560px){.intro{display:block}.intro .actions{margin-top:15px}.form{grid-template-columns:1fr}.field.full,.form-actions{grid-column:auto}.metrics{grid-template-columns:repeat(2,1fr)}.score-grid{grid-template-columns:repeat(2,1fr)}.top{height:60px}.top .user{display:none}}
</style></head>
<body><div class="shell"><aside class="side" id="sidebar"><div class="brand"><span class="mark">F</span><strong>Faithfulord Studio</strong><small>Powered by PALM92</small></div><nav class="nav" id="nav">
<button data-page="dashboard" class="active"><span>◫</span>Overview</button><button data-page="products"><span>⌕</span>Product research</button><button data-page="content"><span>✧</span>Content lab</button><button data-page="calendar"><span>▦</span>Campaign calendar</button><button data-page="leads"><span>↗</span>Lead flow</button><button data-page="results"><span>▥</span>Results</button><button data-page="dependencies"><span>☑</span>Dependencies</button><button data-page="settings"><span>⚙</span>Data & settings</button></nav><div class="side-note"><b>Trust first.</b><br>Views are attention. Clicks, orders and commission are separate outcomes. Human review stays in the loop.</div></aside><main><header class="top"><div style="display:flex;gap:12px;align-items:center"><button class="btn menu-toggle" id="menu">☰</button><h1 id="pageTitle">Overview</h1></div><div class="user">UK first · Human reviewed</div></header><div class="content" id="app"></div></main></div><div id="toast" class="toast hidden"></div><div id="modalRoot"></div>
<script>
(()=>{'use strict';const KEY='faithfulordAffiliateStudioV1';const defaults={products:[],posts:[],deps:[{id:'program',title:'Choose and join one UK affiliate programme',detail:'Compare TikTok Shop UK, Amazon Associates UK and eBay Partner Network. Confirm eligibility and terms before applying.',status:'not-started',evidence:''},{id:'account',title:'Prepare a public creator profile',detail:'Set the profile name, bio, niche and contact route. Confirm follower and content requirements for the selected programme.',status:'not-started',evidence:''},{id:'offer',title:'Verify products, seller and claims',detail:'Check current UK stock, price, seller quality, product details and any usage restrictions before promoting.',status:'not-started',evidence:''},{id:'tracking',title:'Set up compliant link tracking',detail:'Use each programme’s own tracked links first. Record clicks and conversions without collecting unnecessary personal data.',status:'not-started',evidence:''},{id:'disclosure',title:'Ad disclosure and content rules',detail:'Put “Ad” prominently at the start of affiliate content. Keep claims supported and disclose illustrative AI visuals where needed.',status:'not-started',evidence:''},{id:'meta',title:'Comment-to-DM automation',detail:'Only connect an approved provider after checking current Meta permissions, account access and opt-in behaviour. Keep manual replies as Plan B.',status:'not-started',evidence:''},{id:'whatsapp',title:'Create an opt-in WhatsApp Channel',detail:'Use a Channel for deal updates so followers do not expose their phone numbers to each other. Publish clear join and leave instructions.',status:'not-started',evidence:''},{id:'schedule',title:'Plan a sustainable publishing rhythm',detail:'Schedule drafts in the platform or a compliant scheduler. Start small and review performance before increasing volume.',status:'not-started',evidence:''}],activeProgram:'',channelUrl:''};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{state=structuredClone(defaults)}const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n||0).toLocaleString('en-GB',{maximumFractionDigits:2});function save(){localStorage.setItem(KEY,JSON.stringify(state));}function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2500)}function score(p){let vals=['fit','proof','commission','creative','uk'].map(k=>Number(p[k]||0));return Math.round(vals.reduce((a,b)=>a+b,0)/5)}function setPage(page){state.page=page;save();$('#sidebar').classList.remove('open');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const names={dashboard:'Overview',products:'Product research',content:'Content lab',calendar:'Campaign calendar',leads:'Lead flow',results:'Results',dependencies:'Dependencies',settings:'Data & settings'};$('#pageTitle').textContent=names[page]||'Overview';render()}$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');
function header(kicker,title,sub,button=''){return `<div class="intro"><div><div class="eyebrow">${kicker}</div><h2>${title}</h2><p>${sub}</p></div>${button}</div>`}function stat(label,value,sub){return `<div class="card stat"><label>${label}</label><strong>${value}</strong><small>${sub}</small></div>`}function productCards(){if(!state.products.length)return `<div class="empty">No products yet. Add one offer and capture the evidence before creating a post.</div>`;return `<div class="item-list">${state.products.map(p=>`<div class="product"><div class="product-head"><div><h4>${esc(p.name)}</h4><p>${esc(p.retailer||'Retailer not set')} · ${esc(p.category||'Uncategorised')} · £${esc(p.price||'—')}</p></div><span class="score">${score(p)}/5</span></div><p>${esc(p.audience||'Audience not recorded')}</p><div class="row"><small>${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noreferrer">Open offer ↗</a>`:'Affiliate URL missing'} · ${p.evidence?'Evidence noted':'Evidence needed'}</small><div><button class="btn small" data-edit-product="${p.id}">Edit</button> <button class="btn small danger" data-del-product="${p.id}">Remove</button></div></div></div>`).join('')}</div>`}function dashboard(){const clicks=state.posts.reduce((a,p)=>a+Number(p.clicks||0),0),orders=state.posts.reduce((a,p)=>a+Number(p.orders||0),0),commission=state.posts.reduce((a,p)=>a+Number(p.commission||0),0),published=state.posts.filter(p=>p.status==='published').length,done=state.deps.filter(d=>d.status==='verified').length;return `${header('Your UK affiliate workspace','Build trust before chasing reach.','A simple operating system for research, original posts, opt-in follow-up and measurable results.','<button class="btn primary" data-open="product">＋ Add product</button>')}<div class="grid stats">${stat('Products researched',fmt(state.products.length),'Your shortlist')}${stat('Posts published',fmt(published),'Manual status tracking')}${stat('Link clicks',fmt(clicks),`${fmt(orders)} recorded orders`)}${stat('Commission',`£${fmt(commission)}`,'Commission is not profit')}</div><div class="grid two"><section class="card"><div class="section-title"><h3>Start a campaign</h3><span class="pill">4 steps</span></div>${[['1','Research one product','Record a UK offer and evidence.'],['2','Create an original concept','Use the content lab to build your own angle.'],['3','Complete the disclosure gate','Check the claims, “Ad” label and link.'],['4','Publish, then measure','Record clicks, orders and commission separately.']].map(x=>`<div class="row"><span class="pill">${x[0]}</span><div style="flex:1"><strong>${x[1]}</strong><small>${x[2]}</small></div><button class="btn small" data-goto="${['products','content','content','results'][Number(x[0])-1]}">Open</button></div>`).join('')}</section><section class="card"><div class="section-title"><h3>Dependencies</h3><span class="pill ${done===state.deps.length?'good':'warn'}">${done}/${state.deps.length} verified</span></div><div class="progress"><i style="width:${Math.round(done/state.deps.length*100)}%"></i></div><p class="muted small">Platform connections remain manual until you connect and verify them.</p><button class="btn" data-goto="dependencies">Review checklist</button></section></div><div class="grid two" style="margin-top:15px"><section class="card"><div class="section-title"><h3>Product shortlist</h3><button class="btn small" data-goto="products">Manage</button></div>${productCards()}</section><section class="card"><div class="section-title"><h3>Next posts</h3><button class="btn small" data-goto="calendar">Calendar</button></div>${state.posts.length?`<div class="calendar-list">${state.posts.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(0,4).map(p=>`<div class="row"><div class="calendar-date">${esc(p.date||'No date')}</div><div style="flex:1"><strong>${esc(p.hook||p.title||'Draft post')}</strong><small>${esc(p.platform||'Platform not set')} · ${esc(p.status||'draft')}</small></div><span class="pill ${p.status==='published'?'good':''}">${esc(p.status||'draft')}</span></div>`).join('')}</div>`:`<div class="empty">No posts planned yet. Create a concept in Content Lab.</div>`}</section></div><div class="footer">Faithfulord Affiliate Studio · PALM92 · Local-first workspace</div>`}
function products(){return `${header('Offer desk','Research the product, not just the commission.','Score each offer from 1 to 5. Keep evidence and UK availability visible.','<button class="btn primary" data-open="product">＋ Add product</button>')}<div class="grid two"><section class="card"><div class="section-title"><h3>Your products</h3><span class="pill">${state.products.length} saved</span></div>${productCards()}</section><section class="card"><h3 style="margin-top:0">Research standard</h3><p class="muted">Before promoting, confirm the exact UK product page, seller, current price, delivery information, return terms and any claims you plan to repeat.</p><div class="notice">AI can organise the research. It cannot turn an unverified claim into evidence.</div><h4>Score guide</h4><ol class="small muted"><li>Audience fit</li><li>Quality of product and seller evidence</li><li>Commission attractiveness</li><li>Creative potential for original content</li><li>UK availability and delivery suitability</li></ol></section></div>`}
function content(){return `${header('Creative desk','Make the format yours.','Create a fresh product angle from verified facts. The template does not copy another creator’s post.','')}<div class="grid two"><section class="card"><div class="form"><div class="field full"><label>Product</label><select id="cProduct"><option value="">Choose a researched product</option>${state.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Audience</label><input id="cAudience" placeholder="Who is this genuinely useful for?"></div><div class="field"><label>Content pattern to study</label><select id="cPattern"><option>Before and after transformation</option><option>Small problem, practical solution</option><option>Gift discovery</option><option>Budget comparison</option><option>“3 things I noticed” carousel</option><option>My own format</option></select></div><div class="field full"><label>Verified product facts</label><textarea id="cFacts" placeholder="Paste only facts confirmed from the retailer or seller page. Include source notes."></textarea></div><div class="field full"><label>Your original angle or story</label><textarea id="cAngle" placeholder="What question or situation will make this useful to your audience?"></textarea></div><div class="form-actions"><button class="btn primary" id="makeConcept">Build campaign draft</button></div></div></section><section class="card"><div class="section-title"><h3>Review before saving</h3><span class="pill warn">Human approval</span></div><div class="check"><input type="checkbox" id="orig"><label for="orig">I have made a new script and visual concept, not copied another post.</label></div><div class="check"><input type="checkbox" id="tested"><label for="tested">The copy does not claim I tried or tested the product unless I did.</label></div><div class="check"><input type="checkbox" id="aiVisual"><label for="aiVisual">If the image is illustrative, I will label it clearly and avoid fake proof.</label></div><div class="check"><input type="checkbox" id="adCheck"><label for="adCheck">The post starts with “Ad” when I earn commission from the link.</label></div><div class="check"><input type="checkbox" id="factsCheck"><label for="factsCheck">The product facts, price and availability have been checked.</label></div><div id="conceptGate" class="notice" style="margin-top:12px">Complete the checks, then build a draft.</div></section></div><section id="conceptOutput" class="card hidden" style="margin-top:15px"></section>`}
function calendar(){return `${header('Publishing desk','A steady rhythm beats a frantic burst.','Plan drafts here. Publishing and messaging are manual until genuine platform connections are configured.','<button class="btn primary" data-open="post">＋ Plan post</button>')}<div class="card"><div class="section-title"><h3>Campaign schedule</h3><span class="pill">${state.posts.length} posts</span></div>${state.posts.length?`<div class="calendar-list">${state.posts.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(p=>`<div class="post"><div class="product-head"><div><div class="calendar-date">${esc(p.date||'Date TBD')}</div><h4 style="margin-top:10px">${esc(p.hook||p.title||'Draft post')}</h4><p>${esc(p.platform||'Platform not set')} · ${esc(p.status||'draft')} · ${esc(p.productName||'No product selected')}</p></div><span class="pill ${p.status==='published'?'good':'warn'}">${esc(p.status||'draft')}</span></div><p>${esc(p.caption||'No caption yet')}</p><div class="actions"><button class="btn small" data-edit-post="${p.id}">Edit</button>${p.status!=='published'?`<button class="btn small" data-publish="${p.id}">Mark published</button>`:''}<button class="btn small" data-results="${p.id}">Record results</button><button class="btn small danger" data-del-post="${p.id}">Remove</button></div></div>`).join('')}</div>`:`<div class="empty">Nothing scheduled. Use “Plan post” or save a concept from Content Lab.</div>`}</div>`}
function leads(){return `${header('Audience pathway','Let people choose to hear from you.','Use an opt-in route for product links and deal updates. A private channel protects members’ phone-number privacy.','')}<div class="grid two"><section class="card"><h3 style="margin-top:0">Comment-to-link flow</h3><div class="field"><label>Comment keyword</label><input id="leadKeyword" value="LINK" /></div><div class="field" style="margin-top:10px"><label>Public comment reply</label><textarea id="leadPublic">Thanks for asking. I’ll send you the product details by DM.</textarea></div><div class="field" style="margin-top:10px"><label>DM reply</label><textarea id="leadDm">Here is the product link you requested: [tracked affiliate link]. This is an ad/affiliate link and I may earn commission if you buy. Would you like to opt in to UK deal updates on my WhatsApp Channel?</textarea></div><div class="field" style="margin-top:10px"><label>WhatsApp Channel invite link</label><input id="channelUrl" placeholder="Add after you create your Channel" value="${esc(state.channelUrl||'')}"></div><div class="actions" style="margin-top:12px"><button class="btn" id="saveLead">Save templates</button><button class="btn" id="copyLead">Copy DM template</button></div></section><section class="card"><h3 style="margin-top:0">Connection status</h3><div class="notice">No messages are sent by this app. It prepares the wording and setup steps; sending requires an approved provider and your account permissions.</div><div class="row"><div><strong>Manual reply</strong><small>Ready as a no-cost fallback</small></div><span class="pill good">Ready</span></div><div class="row"><div><strong>Comment-to-DM provider</strong><small>Connect only after checking current Meta rules and permissions</small></div><span class="pill warn">Not connected</span></div><div class="row"><div><strong>WhatsApp Channel</strong><small>Invite only people who choose to join</small></div><span class="pill ${state.channelUrl?'good':'warn'}">${state.channelUrl?'Link saved':'Not set up'}</span></div><p class="small muted">Do not add people to a group without permission. Include a clear way to stop receiving updates.</p></section></div>`}
function results(){const clicks=state.posts.reduce((a,p)=>a+Number(p.clicks||0),0),orders=state.posts.reduce((a,p)=>a+Number(p.orders||0),0),views=state.posts.reduce((a,p)=>a+Number(p.views||0),0),comm=state.posts.reduce((a,p)=>a+Number(p.commission||0),0);const ctr=views?clicks/views*100:0,conv=clicks?orders/clicks*100:0;return `${header('Measurement','Reach is not revenue.','Record each stage separately, including returns. Commission is not profit after costs.','')}<div class="grid stats">${stat('Views / reach',fmt(views),'Attention metric')}${stat('Link clicks',fmt(clicks),`CTR ${ctr.toFixed(2)}%`)}${stat('Orders',fmt(orders),`Click-to-order ${conv.toFixed(2)}%`)}${stat('Commission',`£${fmt(comm)}`,'Before costs and adjustments')}</div><div class="card"><div class="section-title"><h3>Post performance</h3><span class="pill">${state.posts.length} campaigns</span></div>${state.posts.length?`<div class="item-list">${state.posts.map(p=>`<div class="post"><div class="product-head"><div><h4>${esc(p.hook||p.title||'Campaign')}</h4><p>${esc(p.productName||'Product not selected')} · ${esc(p.platform||'Platform')} · ${esc(p.status||'draft')}</p></div><button class="btn small" data-results="${p.id}">Update metrics</button></div><div class="metrics" style="margin-top:10px"><div><small>Views</small><strong>${fmt(p.views)}</strong></div><div><small>Clicks</small><strong>${fmt(p.clicks)}</strong></div><div><small>Orders</small><strong>${fmt(p.orders)}</strong></div><div><small>Returns</small><strong>${fmt(p.returns)}</strong></div><div><small>Commission</small><strong>£${fmt(p.commission)}</strong></div></div></div>`).join('')}</div>`:`<div class="empty">Create a campaign, then record actual results here. Demo numbers are not preloaded.</div>`}</div><div class="notice" style="margin-top:14px">Views and engagement can show interest. Only affiliate dashboards and order records can confirm sales and commission.</div>`}
function dependencies(){return `${header('Setup board','Connect the parts that make the funnel work.','Mark an item verified only when you have checked it in the real account. Keep evidence notes for each decision.','')}<div class="card"><div class="section-title"><h3>UK launch dependencies</h3><span class="pill">${state.deps.filter(d=>d.status==='verified').length}/${state.deps.length} verified</span></div><div class="field" style="max-width:400px;margin-bottom:15px"><label>Selected affiliate programme</label><select id="program"><option value="">Not chosen</option><option ${state.activeProgram==='TikTok Shop UK'?'selected':''}>TikTok Shop UK</option><option ${state.activeProgram==='Amazon Associates UK'?'selected':''}>Amazon Associates UK</option><option ${state.activeProgram==='eBay Partner Network'?'selected':''}>eBay Partner Network</option><option ${state.activeProgram==='Other UK programme'?'selected':''}>Other UK programme</option></select></div>${state.deps.map(d=>`<div class="product dependency"><div><strong>${esc(d.title)}</strong><p class="muted small">${esc(d.detail)}</p><div class="field"><label>Evidence / next action</label><input data-evidence="${d.id}" value="${esc(d.evidence)}" placeholder="Paste a note, official URL or what remains to do"></div></div><select data-dep="${d.id}"><option value="not-started" ${d.status==='not-started'?'selected':''}>Not started</option><option value="in-progress" ${d.status==='in-progress'?'selected':''}>In progress</option><option value="verified" ${d.status==='verified'?'selected':''}>Verified</option></select></div>`).join('')}<div class="notice" style="margin-top:15px">Current external accounts are not connected. This workspace does not store passwords, payment details or access tokens.</div></div>`}
function settings(){return `${header('Your workspace','Your records stay in this browser.','Export a backup before changing devices. This standalone version does not send your product or lead data to a server.','')}<div class="grid two"><section class="card"><h3 style="margin-top:0">Data backup</h3><p class="muted">Products, campaigns, results and dependency notes are saved in this browser’s local storage.</p><div class="actions"><button class="btn primary" id="exportJson">Export backup (.json)</button><button class="btn" id="exportCsv">Export campaigns (.csv)</button><label class="btn" for="importFile">Import backup</label><input class="hidden" id="importFile" type="file" accept="application/json"></div></section><section class="card"><h3 style="margin-top:0">Reset workspace</h3><p class="muted">This removes locally saved records from this browser.</p><button class="btn danger" id="reset">Clear all local data</button><p class="footer">No demo campaigns or fake performance metrics are included.</p></section></div><div class="notice" style="margin-top:15px">If you clear browser storage or switch devices, restore from an exported JSON backup.</div>`}
function render(){const page=state.page||'dashboard';const views={dashboard,products,content,calendar,leads,results,dependencies,settings};$('#app').innerHTML=(views[page]||dashboard)();bindPage()}
function modal(html){$('#modalRoot').innerHTML=`<div class="modal-back" id="backdrop"><div class="modal">${html}</div></div>`;$('#backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')$('#modalRoot').innerHTML=''})}function openProduct(p={}){modal(`<div class="section-title"><h3>${p.id?'Edit':'Add'} a product offer</h3><button class="btn" id="closeModal">Close</button></div><form id="productForm" class="form"><input type="hidden" name="id" value="${esc(p.id||'')}"><div class="field"><label>Product name *</label><input required name="name" value="${esc(p.name||'')}"></div><div class="field"><label>UK retailer / programme</label><input name="retailer" value="${esc(p.retailer||'')}"></div><div class="field"><label>Product page / tracked URL</label><input type="url" name="url" value="${esc(p.url||'')}"></div><div class="field"><label>Category</label><input name="category" value="${esc(p.category||'')}"></div><div class="field"><label>Price in GBP</label><input type="number" min="0" step="0.01" name="price" value="${esc(p.price||'')}"></div><div class="field"><label>Commission rate (%)</label><input type="number" min="0" step="0.01" name="rate" value="${esc(p.rate||'')}"></div><div class="field"><label>Target audience</label><input name="audience" value="${esc(p.audience||'')}"></div><div class="field"><label>Evidence source / seller notes</label><input name="evidence" value="${esc(p.evidence||'')}"></div><div class="field full"><label>Score each from 1 to 5</label><div class="score-grid">${[['fit','Audience fit'],['proof','Evidence'],['commission','Commission'],['creative','Creative'],['uk','UK suitability']].map(([k,l])=>`<div class="field"><label>${l}</label><input type="number" min="1" max="5" name="${k}" value="${esc(p[k]||3)}"></div>`).join('')}</div></div><div class="form-actions"><button type="button" class="btn" id="closeModal2">Cancel</button><button class="btn primary">Save product</button></div></form>`);$('#closeModal').onclick=$('#closeModal2').onclick=()=>$('#modalRoot').innerHTML='';$('#productForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f);o.price=Number(o.price||0);o.rate=Number(o.rate||0);['fit','proof','commission','creative','uk'].forEach(k=>o[k]=Number(o[k]||1));o.id=o.id||crypto.randomUUID();if(p.id)state.products=state.products.map(x=>x.id===o.id?o:x);else state.products.unshift(o);save();$('#modalRoot').innerHTML='';render();toast('Product saved')}}
function openPost(p={}){modal(`<div class="section-title"><h3>${p.id?'Edit':'Plan'} a campaign post</h3><button class="btn" id="closeModal">Close</button></div><form class="form" id="postForm"><input type="hidden" name="id" value="${esc(p.id||'')}"><div class="field full"><label>Product</label><select name="productId"><option value="">Select product</option>${state.products.map(x=>`<option value="${x.id}" ${p.productId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Hook / working title</label><input name="hook" value="${esc(p.hook||'')}"></div><div class="field"><label>Platform</label><select name="platform"><option ${p.platform==='Instagram'?'selected':''}>Instagram</option><option ${p.platform==='TikTok'?'selected':''}>TikTok</option><option ${p.platform==='Facebook'?'selected':''}>Facebook</option><option ${p.platform==='Other'?'selected':''}>Other</option></select></div><div class="field"><label>Publish date</label><input type="date" name="date" value="${esc(p.date||'')}"></div><div class="field"><label>Status</label><select name="status"><option value="draft" ${p.status==='draft'?'selected':''}>Draft</option><option value="planned" ${p.status==='planned'?'selected':''}>Planned</option><option value="published" ${p.status==='published'?'selected':''}>Published</option></select></div><div class="field full"><label>Caption / post copy</label><textarea name="caption">${esc(p.caption||'')}</textarea></div><div class="form-actions"><button type="button" class="btn" id="closeModal2">Cancel</button><button class="btn primary">Save campaign</button></div></form>`);$('#closeModal').onclick=$('#closeModal2').onclick=()=>$('#modalRoot').innerHTML='';$('#postForm').onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));const prod=state.products.find(x=>x.id===o.productId);o.productName=prod?.name||'';o.id=o.id||crypto.randomUUID();const old=state.posts.find(x=>x.id===o.id)||{};Object.assign(o,old,o);if(p.id)state.posts=state.posts.map(x=>x.id===o.id?o:x);else state.posts.unshift({...o,views:0,clicks:0,orders:0,returns:0,commission:0});save();$('#modalRoot').innerHTML='';render();toast('Campaign saved')}}
function openResults(id){const p=state.posts.find(x=>x.id===id);if(!p)return;modal(`<div class="section-title"><h3>Record campaign results</h3><button class="btn" id="closeModal">Close</button></div><p class="muted">${esc(p.hook||p.productName||'Campaign')} · Enter actual figures from platform and affiliate dashboards.</p><form class="form" id="resultsForm">${[['views','Views / reach'],['comments','Comments'],['shares','Shares'],['saves','Saves'],['clicks','Link clicks'],['orders','Orders'],['returns','Returns / cancellations'],['commission','Commission (£)']].map(([k,l])=>`<div class="field"><label>${l}</label><input type="number" min="0" step="0.01" name="${k}" value="${esc(p[k]||0)}"></div>`).join('')}<div class="form-actions"><button type="button" class="btn" id="closeModal2">Cancel</button><button class="btn primary">Save results</button></div></form>`);$('#closeModal').onclick=$('#closeModal2').onclick=()=>$('#modalRoot').innerHTML='';$('#resultsForm').onsubmit=e=>{e.preventDefault();Object.assign(p,Object.fromEntries(new FormData(e.target)));['views','comments','shares','saves','clicks','orders','returns','commission'].forEach(k=>p[k]=Number(p[k]||0));save();$('#modalRoot').innerHTML='';render();toast('Results saved')}}
function bindPage(){document.querySelectorAll('[data-open="product"]').forEach(b=>b.onclick=()=>openProduct());document.querySelectorAll('[data-open="post"]').forEach(b=>b.onclick=()=>openPost());document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>setPage(b.dataset.goto));document.querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=()=>openProduct(state.products.find(p=>p.id===b.dataset.editProduct)));document.querySelectorAll('[data-del-product]').forEach(b=>b.onclick=()=>{if(confirm('Remove this product?')){state.products=state.products.filter(p=>p.id!==b.dataset.delProduct);save();render()}});document.querySelectorAll('[data-edit-post]').forEach(b=>b.onclick=()=>openPost(state.posts.find(p=>p.id===b.dataset.editPost)));document.querySelectorAll('[data-del-post]').forEach(b=>b.onclick=()=>{if(confirm('Remove this campaign?')){state.posts=state.posts.filter(p=>p.id!==b.dataset.delPost);save();render()}});document.querySelectorAll('[data-results]').forEach(b=>b.onclick=()=>openResults(b.dataset.results));document.querySelectorAll('[data-publish]').forEach(b=>b.onclick=()=>{const p=state.posts.find(x=>x.id===b.dataset.publish);if(!p)return;const checks=confirm('Confirm the post is already published and the Ad disclosure, product facts, offer link and permissions have been checked?');if(checks){p.status='published';save();render();toast('Status updated. No post was sent from this app.')}});document.querySelectorAll('[data-dep]').forEach(s=>s.onchange=()=>{const d=state.deps.find(x=>x.id===s.dataset.dep);if(d){d.status=s.value;save();render()}});document.querySelectorAll('[data-evidence]').forEach(i=>i.onchange=()=>{const d=state.deps.find(x=>x.id===i.dataset.evidence);if(d){d.evidence=i.value;save()}});const program=$('#program');if(program)program.onchange=()=>{state.activeProgram=program.value;save()};const make=$('#makeConcept');if(make)make.onclick=makeDraft;const saveLead=$('#saveLead');if(saveLead)saveLead.onclick=()=>{state.leadKeyword=$('#leadKeyword').value;state.leadPublic=$('#leadPublic').value;state.leadDm=$('#leadDm').value;state.channelUrl=$('#channelUrl').value;save();toast('Lead templates saved')};const copy=$('#copyLead');if(copy)copy.onclick=async()=>{try{await navigator.clipboard.writeText($('#leadDm').value);toast('DM template copied')}catch{toast('Select and copy the DM text manually')}};const cUrl=$('#channelUrl');if(cUrl)cUrl.onchange=()=>{state.channelUrl=cUrl.value;save()};const ex=$('#exportJson');if(ex)ex.onclick=()=>download('faithfulord-affiliate-backup.json',JSON.stringify(state,null,2),'application/json');const csv=$('#exportCsv');if(csv)csv.onclick=exportCsv;const imp=$('#importFile');if(imp)imp.onchange=importJson;const reset=$('#reset');if(reset)reset.onclick=()=>{if(confirm('Clear all Faithfulord Affiliate Studio data saved in this browser?')){state=structuredClone(defaults);save();render();toast('Local data cleared')}}}
function makeDraft(){const p=state.products.find(x=>x.id===$('#cProduct').value),checks=['orig','tested','aiVisual','adCheck','factsCheck'];if(!checks.every(id=>$('#'+id)?.checked)){toast('Complete all five review checks first');return}if(!p){toast('Add and select a product first');return}if(!p.url||!p.evidence){toast('Add the real product URL and an evidence note before drafting');return}const facts=$('#cFacts').value.trim();if(!facts){toast('Add facts checked against the product page before drafting');return}const audience=$('#cAudience').value.trim()||p.audience||'people comparing useful UK products';const angle=$('#cAngle').value.trim()||'A practical question the audience may have';const pattern=$('#cPattern').value;const hook=`Ad | ${angle}`;const caption=`Ad | ${angle}\n\nFor ${audience.toLowerCase()}: here is a quick look at ${p.name}. ${facts}\n\nCheck the current details and suitability on the retailer’s page before buying. I may earn commission if you purchase through my link.\n\nComment “LINK” if you would like the tracked link.`;const story=`1. Hook: ${angle}.\n2. Show: an original visual that explains ${pattern.toLowerCase()}, using only confirmed product information.\n3. Detail: ${facts}\n4. Close: “Check the current UK listing and decide if it suits you.”\n\nVisual prompt: Create an original, clearly illustrative product discovery visual for ${p.name}. Do not imitate a named creator, copy an existing post, invent a product result, or add text to packaging. Use the supplied product facts only. Mark the visual as AI-generated/illustrative where applicable.`;const out=$('#conceptOutput');out.classList.remove('hidden');out.innerHTML=`<div class="section-title"><h3>Campaign draft</h3><span class="pill warn">Review before use</span></div><div class="grid two"><div><div class="eyebrow">Hook</div><p><strong>${esc(hook)}</strong></p><div class="eyebrow">Caption</div><textarea id="draftCaption" style="width:100%;min-height:130px;border:1px solid var(--line);border-radius:9px;padding:10px">${esc(caption)}</textarea><button class="btn" id="copyCaption">Copy caption</button></div><div><div class="eyebrow">Story beats and visual prompt</div><textarea id="draftStory" style="width:100%;min-height:235px;border:1px solid var(--line);border-radius:9px;padding:10px">${esc(story)}</textarea></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="saveDraft">Save to calendar</button></div>`;$('#copyCaption').onclick=async()=>{try{await navigator.clipboard.writeText($('#draftCaption').value);toast('Caption copied')}catch{toast('Select and copy the caption')}};$('#saveDraft').onclick=()=>{state.posts.unshift({id:crypto.randomUUID(),productId:p.id,productName:p.name,hook,caption:$('#draftCaption').value,story:$('#draftStory').value,platform:'Instagram',date:'',status:'draft',views:0,clicks:0,orders:0,returns:0,commission:0});save();toast('Draft saved to calendar');setPage('calendar')}}
function download(name,data,type){const blob=new Blob([data],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}function exportCsv(){const cols=['productName','hook','platform','date','status','views','comments','shares','saves','clicks','orders','returns','commission'];const lines=[cols.join(','),...state.posts.map(p=>cols.map(k=>'"'+String(p[k]??'').replaceAll('"','""')+'"').join(','))];download('faithfulord-campaign-results.csv',lines.join('\r\n'),'text/csv')}function importJson(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);if(!obj||!Array.isArray(obj.products)||!Array.isArray(obj.posts)||!Array.isArray(obj.deps))throw Error();state=obj;save();render();toast('Backup imported')}catch{alert('This file is not a Faithfulord Affiliate Studio backup.')}};r.readAsText(f)}
render();})();
</script></body></html>
